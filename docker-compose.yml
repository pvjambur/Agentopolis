version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
